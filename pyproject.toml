[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md2html"
version = "0.1.0"
description = "Markdown to HTML converter with navigation, search, and dark mode"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "NightMustEnd" }
]
keywords = ["markdown", "html", "converter", "documentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "markdown>=3.4",
    "pygments>=2.14",
]

[project.scripts]
md2html = "md2html.cli:main"

[project.urls]
Homepage = "https://github.com/username/md2html"
Repository = "https://github.com/username/md2html"

[tool.hatch.build.targets.wheel]
packages = ["src/md2html"]
